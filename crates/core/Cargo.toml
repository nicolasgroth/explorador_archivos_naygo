[package]
name = "naygo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "gen_icons"
required-features = ["gen-icons"]

[features]
gen-icons = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Decodificación de imágenes: PNG/JPEG (íconos) + BMP/GIF/WebP/ICO para la vista
# previa liviana (todas puras-Rust, MIT/Apache, sin libs nativas).
image.workspace = true
# Buscar/reemplazar con regex en el batch-rename. MIT/Apache, sin features extra.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Resaltado de sintaxis para la vista previa de código. Gramáticas + temas embebidos por
# defecto, con el backend de regex puro-Rust (`fancy-regex`, sin `onig`/C → sigue portable).
# Licencia MIT.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Empaquetado/desempaquetado de .naygoset. También lo usa el generador de íconos
# (siempre disponible; no requiere feature).
zip.workspace = true
# Metadata de audio (mp3/flac/ogg/m4a/wav): duración, bitrate, sample rate, tags. Pura-Rust, MIT/Apache.
lofty = "0.22"
# Parseo de XML (docProps de los Office modernos). Puro-Rust, MIT.
quick-xml = "0.39"
# Metadata de PDF (páginas, autor, título). Puro-Rust, MIT. Versión unificada en el workspace.
lopdf.workspace = true
# Fold Unicode para el filtro por tipeo (NFD + marcas combinantes). Pura-Rust, MIT/Apache;
# ya venía transitivamente en el lock, se usa directo en `text_match`.
unicode-normalization = "0.1"
# Deps del generador de íconos (solo bajo feature gen-icons, no se incluyen en la app).
resvg = { version = "0.47", optional = true }
usvg = { version = "0.47", optional = true }
tiny-skia = { version = "0.12", optional = true }

[dev-dependencies]
tempfile.workspace = true
