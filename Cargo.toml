[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/ui-gen", "crates/ui-slint"]

[workspace.package]
version = "0.5.6"
edition = "2021"
authors = ["Nicolás Groth <ngroth@gmail.com>"]
license = "MIT"
repository = "https://github.com/nicolasgroth/explorador_archivos_naygo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
windows = "0.62"
# Metadata/preview de PDF. Versión única para core y ui-slint. OJO: `pdf-extract 0.10`
# arrastra su propio lopdf 0.38 de forma transitiva; no se puede unificar sin cambiar
# pdf-extract, así que esa segunda versión queda (aceptado).
lopdf = "0.41"
# Decodificación de imágenes (íconos y vista previa). Puras-Rust, MIT/Apache.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
# Empaquetado .naygoset / import-export de packs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
# Toolkit de UI. Definición ÚNICA de features: la usan naygo-ui-gen (código generado desde los
# .slint) y naygo-ui-slint (APIs de Slint en Rust), así ambas quedan unificadas.
slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
    # Exporta el árbol Slint a los lectores de pantalla del sistema (AccessKit).
    "accessibility",
    # Acceso al handle nativo de la ventana (HWND) para el menú contextual del Shell.
    "raw-window-handle-06",
] }

# Perfil dev: el código Slint generado (naygo-ui-gen, ~32 MiB) no se depura a mano y su
# debuginfo completa dominaba el pico de memoria de link.exe. Medido (CARGO_BUILD_JOBS=1,
# tocar un .rs de ui-slint): completa 6,39 GiB WS; "line-tables-only" 4,78; sin debuginfo
# 4,49. Se deja sin debuginfo solo para ese crate; el resto del workspace (incluido
# naygo-ui-slint) conserva la debuginfo completa.
[profile.dev.package.naygo-ui-gen]
debug = false

# Perfil de release optimizado para distribución: binario chico, pensado para correr
# en máquinas con pocos recursos. La velocidad es la prioridad del proyecto, así que
# opt-level="s" (tamaño sin sacrificar tanto rendimiento como "z") y panic=unwind
# (default) para poder recuperar de un panic en un worker sin que la app caiga; el
# panic handler igual loguea. `debug = "line-tables-only"` genera el naygo.pdb con
# nombres de función y archivo:línea (suficiente para el backtrace del panic handler,
# según la documentación de rustc) pero sin la información de tipos y variables que
# inflaba el enlazado; en MSVC los símbolos viven en el .pdb y el .exe solo guarda un
# puntero a él, así que el exe casi no crece. El .pdb es opcional en el instalador y no
# se incluye en el ZIP portable. ThinLTO evita unir toda la app en un único módulo
# gigante; 16 unidades reducen el tamaño del trabajo individual. Mantener un solo
# trabajo Cargo al empaquetar y supervisar memoria; no es un techo de RSS del producto.
# Revalidar tamaño/rendimiento al cambiar este perfil, no asumir equivalencia con fat LTO.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
debug = "line-tables-only"

# Perfil de DIAGNÓSTICO: mismo código que release pero compilado RÁPIDO (sin LTO y con
# codegen-units=16), para cazar una caída sin esperar el build
# completo. Los símbolos ya no lo diferencian (release también los genera desde que
# se agregó la debuginfo arriba). Build: `cargo build --profile diag -p naygo-ui-slint`.
# El .exe queda en target/diag/. NO es el binario de distribución; solo para cazar caídas.
[profile.diag]
inherits = "release"
# Sin LTO: el diagnóstico no necesita la optimización entre crates del distribuible.
# El tiempo depende del equipo y caché; reproducir el fallo también contra release.
lto = false
codegen-units = 16
