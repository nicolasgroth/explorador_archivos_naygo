[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/ui-slint"]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Nicolás Groth <ngroth@gmail.com>"]
license = "MIT"
repository = "https://github.com/nicolasgroth/explorador_archivos_naygo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows = "0.62"
# Metadata/preview de PDF. Versión única para core y ui-slint. OJO: `pdf-extract 0.10`
# arrastra su propio lopdf 0.38 de forma transitiva; no se puede unificar sin cambiar
# pdf-extract, así que esa segunda versión queda (aceptado).
lopdf = "0.41"
# Decodificación de imágenes (íconos y vista previa). Puras-Rust, MIT/Apache.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
# Empaquetado .naygoset / import-export de packs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Perfil de release optimizado para distribución: binario chico, pensado para correr
# en máquinas con pocos recursos. La velocidad es la prioridad del proyecto, así que
# opt-level="s" (tamaño sin sacrificar tanto rendimiento como "z") y panic=unwind
# (default) para poder recuperar de un panic en un worker sin que la app caiga; el
# panic handler igual loguea. `debug = true` genera el naygo.pdb con los símbolos:
# en MSVC los símbolos viven en el .pdb y el .exe solo guarda un puntero a él, así
# que el exe casi no crece, y el backtrace del panic handler muestra nombres de
# función reales en vez de `<unknown>`. El .pdb se distribuye junto al exe
# (instalador Inno y ZIP portable).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true

# Perfil de DIAGNÓSTICO: mismo código que release pero compilado RÁPIDO (sin LTO y con
# codegen-units=16, ~2 min en vez de ~20), para cazar una caída sin esperar el build
# completo. Los símbolos ya no lo diferencian (release también los genera desde que
# se agregó `debug = true` arriba). Build: `cargo build --profile diag -p naygo-ui-slint`.
# El .exe queda en target/diag/. NO es el binario de distribución; solo para cazar caídas.
[profile.diag]
inherits = "release"
# Sin LTO ni codegen-units=1: el diagnóstico no necesita el binario más chico/rápido,
# y así compila en ~2 min en vez de ~20. El panic se reproduce igual.
lto = false
codegen-units = 16
